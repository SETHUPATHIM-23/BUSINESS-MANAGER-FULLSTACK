
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTHUR CHEMICAL - Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base styles for the app */
        body {
            background-color: #f9fafb;
            color: #111827;
            margin: 0;
            padding: 0;
        }

        /* Remove default spin buttons from number inputs */
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }

        /* Firefox */
        input[type=number] {
          -moz-appearance: textfield;
        }

        /* Print Specific Styles */
        @media print {
            /* Hide everything by default */
            html, body, #root, .max-w-7xl {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                background: white !important;
                box-shadow: none !important;
            }

            /* Specifically hide the no-print class */
            .no-print {
                display: none !important;
            }

            /* Reset container for print */
            .invoice-preview-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                background: transparent !important;
                min-height: 0 !important;
            }

            /* Forced A4 formatting */
            @page {
                size: A4;
                margin: 0;
            }

            .invoice-container {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
                box-shadow: none !important;
                page-break-after: always;
                display: block !important;
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                border: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Ensure background colors are printed */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Screen Preview Styling */
        .invoice-preview-wrapper {
            background-color: #374151; /* Dark background for preview */
            padding: 40px 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .invoice-container {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        /* Prevent scrollbars on the container in preview */
        #root {
            overflow-x: hidden;
        }
    </style>
